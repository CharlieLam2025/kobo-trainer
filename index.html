<!-- Tailwind v3 JIT · 本地化（vendor/）· 同源加载 · 不再依赖任何外部 CDN -->
<script src="vendor/tailwind.min.js"></script>
<script>
  /* RANEPA palette remapped onto Tailwind's amber/stone scales so the entire
     existing component tree picks it up automatically. */
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          /* amber slot becomes the crimson brand family */
          amber: {
            50:  '#FBEFF2',
            100: '#F7DCE4',
            200: '#EEA5B4',
            300: '#FFFFFF',   /* "amber-300 on dark" reads as white */
            400: '#A30236',
            500: '#8E0230',
            600: '#700024',
            700: '#A30236',
            800: '#700024',
            900: '#52001A',
          },
          /* stone slot becomes the RANEPA grey ramp */
          stone: {
            50:  '#FAFAF9',
            100: '#F4F4F2',
            200: '#E6E6E6',
            300: '#D5D5D2',
            400: '#999999',
            500: '#6D6D6D',
            600: '#48494A',
            700: '#404040',
            800: '#323232',
            900: '#262626',
            950: '#0F0F0F',
          },
          /* misc accent slots — kept restrained */
          rose:    { 100:'#FBEFF2', 200:'#F4D4DD', 700:'#A30236' },
          orange:  { 50:'#FFF6EC', 100:'#FCE6CC', 200:'#F1A23F', 400:'#EB5E3F' },
          violet:  { 100:'#E9EBF5', 200:'#C5CBE6', 900:'#061A6C' },
          emerald: { 50:'#EEF6F0', 100:'#D6E9D9', 200:'#B6D8BC', 600:'#2F6B3D', 700:'#264F30', 900:'#1B3522' },
          sky:     { 100:'#E9EBF5', 200:'#C5CBE6' },
          red:     { 50:'#FBEFF2', 100:'#F7DCE4', 200:'#EEA5B4', 400:'#BE003E', 600:'#A30236', 700:'#8E0230' },
          navy:    { DEFAULT:'#061A6C', alt:'#001A71', pale:'#E9EBF5' },
        },
        fontFamily: {
          display: ['"Yandex Sans Display"','"Yandex Sans Text"','"PingFang SC"','"Microsoft YaHei"','system-ui','sans-serif'],
          body:    ['"Yandex Sans Text"','"PingFang SC"','"Microsoft YaHei"','system-ui','sans-serif'],
        },
        borderRadius: {
          /* RANEPA prefers near-square; clamp every "rounded-*" token */
          none: '0', sm:'2px', DEFAULT:'3px', md:'3px', lg:'4px', xl:'4px',
          '2xl':'6px', '3xl':'6px', full:'9999px',
        },
        boxShadow: {
          sm:  '0 1px 2px rgba(38,38,38,0.06)',
          DEFAULT: '0 1px 2px rgba(38,38,38,0.06), 0 4px 16px rgba(38,38,38,0.05)',
          md:  '0 4px 16px rgba(38,38,38,0.06)',
          lg:  '0 8px 32px rgba(38,38,38,0.10)',
        },
      }
    }
  };
</script>
<!-- Sentry · 错误上报（DSN 留空 → 不加载 SDK · 不联网 · 零阻塞）-->
<script>
  // 把你的 Sentry DSN 填这里（在 sentry.io 免费注册后拿到）· 留空则完全不加载 SDK
  window.__SENTRY_DSN__ = ''; // ← 填入 'https://xxx@oXXX.ingest.sentry.io/XXX'
  // 只有配置了 DSN 才动态加载 SDK · 否则一行外网请求都不发
  if (window.__SENTRY_DSN__) {
    const s = document.createElement('script');
    s.src = 'https://browser.sentry-cdn.com/8.34.0/bundle.min.js';
    s.async = true;
    s.onload = () => {
      try {
        window.Sentry?.init({
          dsn: window.__SENTRY_DSN__,
          release: 'kobo-trainer@v11',
          environment: 'production',
          tracesSampleRate: 0.1,
          beforeSend(event) {
            const u = event.request?.url || '';
            if (u.includes('localhost') || u.includes('127.0.0.1')) return null;
            return event;
          },
          sendDefaultPii: false,
        });
      } catch (e) { /* swallow */ }
    };
    s.onerror = () => { /* swallow */ };
    document.head.appendChild(s);
  }
</script>
<!-- React + ReactDOM · 本地化（vendor/）· 已不再需要 Babel：JSX 在构建阶段就编译成 bundle.js -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<!-- MediaPipe Face Landmarker（懒加载：用户开启美颜面部 FX 时才真正初始化）-->
<script type="module">
  // 预解析 ESM 模块，挂到全局；若网络/沙箱拦截则静默失败，cam 退回纯 CSS 滤镜路径
  try {
    const mod = await import('./mediapipe/vision_bundle.mjs');
    window.__MEDIAPIPE = {
      FilesetResolver: mod.FilesetResolver,
      FaceLandmarker:  mod.FaceLandmarker,
      ImageSegmenter:  mod.ImageSegmenter,
    };
    window.dispatchEvent(new Event('mediapipe-ready'));
  } catch (e) {
    console.warn('[MediaPipe] failed to load:', e?.message || e);
  }
</script>
<style>
  /* ─── Yandex Sans (the RANEPA brand face) ─────────────────────── */
  @font-face { font-family: "Yandex Sans Display"; font-weight: 300; font-display: swap;
    src: url("fonts/YandexSansDisplay-Light.woff2") format("woff2"); }
  @font-face { font-family: "Yandex Sans Display"; font-weight: 400; font-display: swap;
    src: url("fonts/YandexSansDisplay-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Yandex Sans Display"; font-weight: 700; font-display: swap;
    src: url("fonts/YandexSansDisplay-Bold.woff2") format("woff2"); }
  @font-face { font-family: "Yandex Sans Text"; font-weight: 300; font-display: swap;
    src: url("fonts/YandexSansText-Light.woff2") format("woff2"); }
  @font-face { font-family: "Yandex Sans Text"; font-weight: 400; font-display: swap;
    src: url("fonts/YandexSansText-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Yandex Sans Text"; font-weight: 500; font-display: swap;
    src: url("fonts/YandexSansText-Medium.woff2") format("woff2"); }
  @font-face { font-family: "Yandex Sans Text"; font-weight: 700; font-display: swap;
    src: url("fonts/YandexSansText-Bold.woff2") format("woff2"); }

  :root {
    --ranepa-crimson:    #A30236;
    --ranepa-crimson-d:  #8E0230;
    --ranepa-crimson-t:  #FBEFF2;
    --ranepa-navy:       #061A6C;
    --ranepa-orange:     #F1A23F;
    --ranepa-ink:        #262626;
    --ranepa-grey:       #6D6D6D;
    --ranepa-line:       #E6E6E6;
  }

  html, body {
    background: #FAFAF9;
    color: var(--ranepa-ink);
    font-family: "Yandex Sans Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    font-feature-settings: "ss01","ss02";
    -webkit-font-smoothing: antialiased;
    /* iOS 原生感：禁用整体下拉刷新 + 自动文字缩放 */
    overscroll-behavior-y: contain;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  /* iOS 原生感细节：禁用文本长按弹出 / 点击高亮 / 误触双击缩放，但保持 input/textarea 可选 */
  body {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  input, textarea, [contenteditable] {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }
  /* 平滑惯性滚动 */
  main, [class*="overflow-y-auto"], [class*="overflow-auto"] {
    -webkit-overflow-scrolling: touch;
  }

  /* a faint paper grid behind everything — institutional feel */
  body.bg-paper { background: #FAFAF9; }

  .font-display { font-family: "Yandex Sans Display","Yandex Sans Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  .font-body    { font-family: "Yandex Sans Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }

  /* RANEPA eyebrow — small caps with letterspacing */
  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ranepa-grey);
    font-family: "Yandex Sans Text", system-ui, sans-serif;
  }
  .eyebrow--crimson { color: var(--ranepa-crimson); }
  .eyebrow--white   { color: #fff; opacity: 0.9; }

  /* a thin crimson rule that sits next to eyebrows / numbers */
  .rule-crimson { display:inline-block; width:24px; height:1px; background: var(--ranepa-crimson); vertical-align: middle; }

  /* big numeric — used on the landing's mode cards */
  .stat-num {
    font-family: "Yandex Sans Display", system-ui, sans-serif;
    font-weight: 700;
    color: var(--ranepa-crimson);
    line-height: 0.9;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  /* RANEPA paper-card: hairline border, no shadow, near-square */
  .paper-card {
    background: #fff;
    border: 1px solid var(--ranepa-line);
    border-radius: 4px;
  }

  /* Hero band — full-bleed crimson with a ghosted watermark glyph */
  .hero-band {
    background: var(--ranepa-crimson);
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .hero-band::after {
    content: "口";
    position: absolute;
    right: -60px; bottom: -120px;
    font-family: "Yandex Sans Display", system-ui, sans-serif;
    font-weight: 700;
    font-size: 520px;
    line-height: 1;
    color: #fff;
    opacity: 0.06;
    pointer-events: none;
  }

  /* Vertical right-edge chrome (year + page no.) */
  .rail {
    position: fixed; right: 24px; top: 96px; bottom: 24px;
    display: flex; flex-direction: column; justify-content: space-between;
    align-items: center; z-index: 5; pointer-events: none;
  }
  .rail .rail-tick { width: 1px; height: 56px; background: var(--ranepa-grey); opacity: 0.4; }
  .rail .rail-year { font-family: "Yandex Sans Display", system-ui, sans-serif; font-size: 12px; font-weight: 700;
    letter-spacing: 0.18em; color: var(--ranepa-grey); writing-mode: vertical-rl; }
  .rail .rail-page { font-family: "Yandex Sans Display", system-ui, sans-serif; font-size: 12px; font-weight: 700;
    letter-spacing: 0.18em; color: var(--ranepa-grey); writing-mode: vertical-rl; }
  @media (max-width: 900px) { .rail { display: none; } }

  /* Numbered slot for mode cards — big crimson numeral with a hair-line */
  .slot-num {
    font-family: "Yandex Sans Display", system-ui, sans-serif;
    font-weight: 700;
    font-size: 56px;
    line-height: 1;
    color: var(--ranepa-crimson);
    font-variant-numeric: tabular-nums;
  }

  /* small caps section divider */
  .divider-caps {
    display: flex; align-items: center; gap: 16px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--ranepa-grey);
  }
  .divider-caps::before, .divider-caps::after { content:""; flex:1; height:1px; background: var(--ranepa-line); }

  /* native input chrome */
  input[type="range"] { accent-color: var(--ranepa-crimson); }
  ::selection { background: var(--ranepa-crimson); color: #fff; }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  .fade-in { animation: fadeIn .25s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px) } to { opacity: 1; transform: translateY(0) } }
  .pulse-rec { animation: pulseRec 1.4s ease-in-out infinite; }
  @keyframes pulseRec { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }
  @keyframes heartFloat {
    0%   { opacity: 0; transform: translateY(0) scale(0.5) rotate(-5deg); }
    15%  { opacity: 1; transform: translateY(-20px) scale(1.1) rotate(0deg); }
    100% { opacity: 0; transform: translateY(-260px) scale(0.8) rotate(8deg); }
  }

  /* default tailwind "rounded-xl/2xl" sneak-in: make sure stand-alone radii
     never balloon back to large */
  .rounded-xl, .rounded-2xl, .rounded-3xl { border-radius: 4px !important; }
  .rounded-lg { border-radius: 4px !important; }
  .rounded-md { border-radius: 3px !important; }
  .rounded-full { border-radius: 9999px !important; }
</style>
</head>
<body class="bg-paper font-body">
<div id="root">
  <div id="kobo-boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FAFAF9;color:#1c1917;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center">
    <div style="font-size:64px;margin-bottom:16px">🎙️</div>
    <div style="font-weight:800;font-size:18px;letter-spacing:-0.01em;margin-bottom:8px">口播练习器加载中</div>
    <div id="kobo-boot-status" style="font-size:12px;color:#78716c;line-height:1.6;max-width:380px">正在准备资源...</div>
    <div id="kobo-boot-diag" style="margin-top:16px;font-size:11px;color:#A30236;font-family:ui-monospace,monospace;white-space:pre-wrap;text-align:left;display:none"></div>
  </div>
</div>
<script>
  // 8 秒还没启动 → 显示诊断信息，告诉用户具体哪个资源没加载上
  window.__koboBootStart = Date.now();
  setTimeout(function() {
    var boot = document.getElementById('kobo-boot');
    if (!boot) return; // React 已挂载就把这个 div 替换了
    var status = document.getElementById('kobo-boot-status');
    var diag = document.getElementById('kobo-boot-diag');
    if (status) status.innerHTML = '⚠️ 加载超时 · 某个本地资源没读到<br/><br/>试试：清空浏览器缓存 / 强制刷新（Ctrl+Shift+R）<br/>如果是 PWA 已安装版本：卸载重装可拉到最新 sw.js';
    if (diag) {
      diag.style.display = 'block';
      diag.textContent = '诊断（' + Math.round((Date.now() - window.__koboBootStart) / 1000) + 's）\n' +
        '─────────────\n' +
        'Tailwind  : ' + (window.tailwind ? '✓' : '✗ vendor/tailwind.min.js') + '\n' +
        'React     : ' + (window.React ? '✓' : '✗ vendor/react.production.min.js') + '\n' +
        'ReactDOM  : ' + (window.ReactDOM ? '✓' : '✗ vendor/react-dom.production.min.js') + '\n' +
        'App Bundle: ' + (window.__KOBO_BOOTED ? '✓' : '✗ bundle.js') + '\n' +
        'MediaPipe : ' + (window.__MEDIAPIPE ? '✓' : '○ 可选');
    }
  }, 8000);
</script>
<script src="bundle.js"></script>
<script>
  // PWA: 注册 service worker（仅在可用环境下）
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW register failed:', err));
    });
  }
</script>
</body>
</html>

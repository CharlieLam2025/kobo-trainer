<!-- Sentry · 错误上报（DSN 留空 → 不加载 SDK · 不联网 · 零阻塞）-->
<script>
  // 把你的 Sentry DSN 填这里（在 sentry.io 免费注册后拿到）· 留空则完全不加载 SDK
  window.__SENTRY_DSN__ = ''; // ← 填入 'https://xxx@oXXX.ingest.sentry.io/XXX'
  // 只有配置了 DSN 才动态加载 SDK · 否则一行外网请求都不发
  if (window.__SENTRY_DSN__) {
    const s = document.createElement('script');
    s.src = 'https://browser.sentry-cdn.com/8.34.0/bundle.min.js';
    s.async = true;
    s.onload = () => {
      try {
        window.Sentry?.init({
          dsn: window.__SENTRY_DSN__,
          release: 'kobo-trainer@v11',
          environment: 'production',
          tracesSampleRate: 0.1,
          beforeSend(event) {
            const u = event.request?.url || '';
            if (u.includes('localhost') || u.includes('127.0.0.1')) return null;
            return event;
          },
          sendDefaultPii: false,
        });
      } catch (e) { /* swallow */ }
    };
    s.onerror = () => { /* swallow */ };
    document.head.appendChild(s);
  }
</script>
<!-- React + ReactDOM · 本地化（vendor/）· 已不再需要 Babel：JSX 在构建阶段就编译成 bundle.js -->
<!-- defer：不阻塞 HTML 解析 · boot 画面立即可见 · defer 脚本按文档顺序执行（react → react-dom → bundle）-->

<!-- MediaPipe Face Landmarker（真懒加载：开美颜面部 FX 时才 import 137KB ESM · 冷启动不下载不解析）-->
<script>
  // use-camera 在 ensureLandmarker/ensureSegmenter 里调这个 loader；
  // 若网络/沙箱拦截则静默失败，cam 退回纯 CSS 滤镜路径
  window.__loadMediaPipe = function() {
    if (window.__MEDIAPIPE) return Promise.resolve(window.__MEDIAPIPE);
    if (window.__MEDIAPIPE_LOADING) return window.__MEDIAPIPE_LOADING;
    window.__MEDIAPIPE_LOADING = import('./mediapipe/vision_bundle.mjs').then(function(mod) {
      window.__MEDIAPIPE = {
        FilesetResolver: mod.FilesetResolver,
        FaceLandmarker:  mod.FaceLandmarker,
        ImageSegmenter:  mod.ImageSegmenter,
      };
      window.dispatchEvent(new Event('mediapipe-ready'));
      return window.__MEDIAPIPE;
    }).catch(function(e) {
      console.warn('[MediaPipe] failed to load:', (e && e.message) || e);
      window.__MEDIAPIPE_LOADING = null; // 失败后允许重试（比如网络恢复）
      return null;
    });
    return window.__MEDIAPIPE_LOADING;
  };
</script>

  /* iOS 原生感细节：禁用文本长按弹出 / 点击高亮 / 误触双击缩放，但保持 input/textarea 可选 */
  body {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;

  }

  }
  /* 平滑惯性滚动 */

    -webkit-overflow-scrolling: touch;
  }

  /* a faint paper grid behind everything — institutional feel */
  body.bg-paper { background: #FAFAF9; }

  .font-display { font-family: "Yandex Sans Display","Yandex Sans Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }
  .font-body    { font-family: "Yandex Sans Text","PingFang SC","Microsoft YaHei",system-ui,sans-serif; }

  /* RANEPA eyebrow — small caps with letterspacing */
  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;

  /* Hero band — full-bleed crimson with a ghosted watermark glyph */

    position: relative;

  }

  /* Numbered slot for mode cards — big crimson numeral with a hair-line */

  /* native input chrome */
  input[type="range"] { accent-color: var(--ranepa-crimson); }

  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* 兼容旧 class · 对齐新 motion 曲线 */
  .fade-in { animation: fadeIn .4s cubic-bezier(0.32, 0.72, 0, 1) both; }
  @keyframes fadeIn {

  .pulse-rec { animation: pulseRec 1.4s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
  @keyframes pulseRec {

  @keyframes heartFloat {

  <div id="kobo-boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FAFAF9;color:#1c1917;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center">

    <div id="kobo-boot-status" style="font-size:12px;color:#78716c;line-height:1.6;max-width:380px">正在准备资源...</div>
    <div id="kobo-boot-diag" style="margin-top:16px;font-size:11px;color:#A30236;font-family:ui-monospace,monospace;white-space:pre-wrap;text-align:left;display:none"></div>
  </div>
</div>
<script>
  // 8 秒还没启动 → 显示诊断信息，告诉用户具体哪个资源没加载上
  window.__koboBootStart = Date.now();
  setTimeout(function() {
    var boot = document.getElementById('kobo-boot');
    if (!boot) return; // React 已挂载就把这个 div 替换了
    var status = document.getElementById('kobo-boot-status');
    var diag = document.getElementById('kobo-boot-diag');
    if (status) status.innerHTML = '⚠️ 加载超时 · 某个本地资源没读到<br/><br/>试试：清空浏览器缓存 / 强制刷新（Ctrl+Shift+R）<br/>如果是 PWA 已安装版本：卸载重装可拉到最新 sw.js';
    if (diag) {
      diag.style.display = 'block';
      var cssLoaded = Array.prototype.some.call(document.styleSheets || [], function(s){
        return (s.href || '').indexOf('styles.css') !== -1;
      });
      diag.textContent = '诊断（' + Math.round((Date.now() - window.__koboBootStart) / 1000) + 's）\n' +
        '─────────────\n' +
        'CSS       : ' + (cssLoaded ? '✓' : '✗ styles.css') + '\n' +
        'React     : ' + (window.React ? '✓' : '✗ vendor/react.production.min.js') + '\n' +
        'ReactDOM  : ' + (window.ReactDOM ? '✓' : '✗ vendor/react-dom.production.min.js') + '\n' +
        'App Bundle: ' + (window.__KOBO_BOOTED ? '✓' : '✗ bundle.js') + '\n' +
        'MediaPipe : ' + (window.__MEDIAPIPE ? '✓' : '○ 可选');
    }
  }, 8000);
</script>
<!-- ESM 入口 · 模式 chunk 按需加载（见 chunks/） -->
<script type="module" src="bundle.js"></script>
<script>
  // PWA: 注册 service worker · 带「新版本就绪」提醒机制
  // sw.js install 时 skipWaiting + activate 时 claim · 所以新 SW 接管页面就是「有更新」
  var isNativeShell = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if (!isNativeShell && 'serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      // 页面加载时如果已有 controller = 老用户（之前装过 SW）· 之后的 controllerchange 才是「更新」
      var hadControllerOnLoad = !!navigator.serviceWorker.controller;

      navigator.serviceWorker.register('sw.js').then(function(reg){
        // 每 30 分钟主动 ping 一次新 sw.js · 让长时间不关页面的用户也能拿到更新
        setInterval(function(){ reg.update().catch(function(){}); }, 30 * 60 * 1000);
      }).catch(function(err){ console.warn('SW register failed:', err); });

      navigator.serviceWorker.addEventListener('controllerchange', function(){
        if (!hadControllerOnLoad) return; // 首次安装不算更新
        window.dispatchEvent(new CustomEvent('kobo:sw-update-ready'));
      });
    });
  }
</script>
